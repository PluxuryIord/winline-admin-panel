# Telegram Mini App — app.winlinepartners.ru (FDMS)
# Установка:
#   cp deploy/nginx-app.winlinepartners.ru.conf /etc/nginx/sites-available/app.winlinepartners.ru
#   cp deploy/cloudflare-realip.conf /etc/nginx/conf.d/cloudflare-realip.conf
#   ln -s /etc/nginx/sites-available/app.winlinepartners.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Cloudflare: proxied A-запись `app` → 80.78.25.34.
# Проверить, что существующий Origin CA cert покрывает *.winlinepartners.ru
# (иначе выпустить новый Origin cert и поправить пути ниже).

server {
    listen 443 ssl http2;
    server_name app.winlinepartners.ru;

    # Пути под фактические сертификаты панели (см. основной server-block winlinepartners.ru)
    ssl_certificate     /etc/ssl/cloudflare/winlinepartners.pem;
    ssl_certificate_key /etc/ssl/cloudflare/winlinepartners.key;

    root /var/www/winline-admin-panel/dist-miniapp;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Хэшированные ассеты — кэшируем надолго; index.html — никогда
    # (иначе после релиза клиенты держат старые ссылки на ассеты).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name app.winlinepartners.ru;
    return 301 https://$host$request_uri;
}
